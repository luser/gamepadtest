<script type="text/javascript" src="gamepadtest.js"></script>
<style>
.axes {
  padding: 0 1em;
}

.buttons {
  margin-left: 1em;
}

#start ~ div h2 {
  margin-left: 1em;
}

#start ~ div h2.axes-heading {
  margin-top: 1.5em;
  margin-bottom: 0;
}

.axis-container {
  display: inline-block;
  margin: 0.25em 1em 1em;
}

.axis {
  min-width: 200px;
}

.axis-label {
  display: block;
  text-align: center;
}

.button {
  display: inline-block;
  width: 1em;
  text-align: center;
  padding: 1em;
  border-radius: 20px;
  border: 1px solid black;
  background-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAAAXNSR0IArs4c6QAAAAxJREFUCNdjYPjPAAACAgEAqiqeJwAAAABJRU5ErkJggg==);
  background-size: 0% 0%;
  background-position: 50% 50%;
  background-repeat: no-repeat;
}

.pressed {
  border: 1px solid red;
}

.touched::after {
  content: "touch";
  display: block;
  position: absolute;
  margin-top: -0.2em;
  margin-left: -0.5em;
  font-size: 0.8em;
  opacity: 0.7;
}
</style>
</head>
<body>
<h2 id="start">Press a button on your controller to start</h2>
